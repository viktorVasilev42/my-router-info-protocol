services:
  router1:
    build: .
    container_name: my-rip-router1
    environment:
      - ROUTER_ID=1
    command: ["./peer-listen", "router", "1"]
    stdin_open: true
    tty: true
    networks:
      custom-net-1:
        ipv4_address: 192.168.10.10
      custom-net-3:
        ipv4_address: 192.168.30.20
      custom-net-4:
        ipv4_address: 192.168.100.10

  router2:
    build: .
    container_name: my-rip-router2
    environment:
      - ROUTER_ID=2
    command: ["./peer-listen", "router", "2"]
    stdin_open: true
    tty: true
    networks:
      custom-net-2:
        ipv4_address: 192.168.20.10
      custom-net-1:
        ipv4_address: 192.168.10.20
      custom-net-5:
        ipv4_address: 192.168.200.10

  router3:
    build: .
    container_name: my-rip-router3
    environment:
      - ROUTER_ID=3
    command: ["./peer-listen", "router", "3"]
    stdin_open: true
    tty: true
    networks:
      custom-net-3:
        ipv4_address: 192.168.30.10
      custom-net-2:
        ipv4_address: 192.168.20.20
      custom-net-6:
        ipv4_address: 192.168.255.10

  host1:
    build: .
    container_name: rip-host1
    environment:
      - HOST_ID=1
    command: ["./peer-listen", "host", "101"]
    stdin_open: true
    tty: true
    networks:
      custom-net-4:
        ipv4_address: 192.168.100.20

  host2:
    build: .
    container_name: rip-host2
    environment:
      - HOST_ID=2
    command: ["./peer-listen", "host", "102"]
    stdin_open: true
    tty: true
    networks:
      custom-net-4:
        ipv4_address: 192.168.100.30

  host3:
    build: .
    container_name: rip-host3
    environment:
      - HOST_ID=3
    command: ["./peer-listen", "host", "201"]
    stdin_open: true
    tty: true
    networks:
      custom-net-5:
        ipv4_address: 192.168.200.20

  host4:
    build: .
    container_name: rip-host4
    environment:
      - HOST_ID=4
    command: ["./peer-listen", "host", "301"]
    stdin_open: true
    tty: true
    networks:
      custom-net-6:
        ipv4_address: 192.168.255.20

  host5:
    build: .
    container_name: rip-host5
    environment:
      - HOST_ID=5
    command: ["./peer-listen", "host", "302"]
    stdin_open: true
    tty: true
    networks:
      custom-net-6:
        ipv4_address: 192.168.255.30

  topology-grapher:
    build: .
    container_name: topology-grapher1
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: "host"
    command: ["./topology-grapher"]
    stdin_open: true
    tty: true
    depends_on:
      - router1
      - router2

networks:
  custom-net-1:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.10.0/24"

  custom-net-2:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.20.0/24"

  custom-net-3:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.30.0/24"

  custom-net-4:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.100.0/24"

  custom-net-5:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.200.0/24"

  custom-net-6:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.255.0/24"
      
